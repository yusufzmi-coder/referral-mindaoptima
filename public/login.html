<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log Masuk — Rujukan Minda Optima</title>
  <meta name="theme-color" content="#0D2A5C">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/common.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">

  <header class="bg-brand">
    <div class="max-w-md mx-auto px-4 py-4">
      <a href="/" class="text-white font-extrabold text-lg tracking-tight">Minda<span class="text-gold">Optima</span></a>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 py-10">
    <div class="rounded-2xl bg-white p-6 sm:p-8 shadow-sm border border-slate-200">

      <!-- Step 1: phone -->
      <form id="phone-form" novalidate>
        <h1 class="text-2xl font-extrabold text-brand">Log Masuk / Daftar</h1>
        <p class="mt-1 text-sm text-slate-500">Kami akan hantar kod OTP ke WhatsApp anda.</p>

        <label for="phone" class="mt-6 block text-sm font-semibold text-slate-700">Nombor Telefon</label>
        <div class="mt-2 flex rounded-xl border border-slate-300 focus-within:border-brand focus-within:ring-2 focus-within:ring-brand/20">
          <span class="flex items-center pl-4 pr-2 text-slate-500 select-none">🇲🇾</span>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national"
                 placeholder="012-3456789" maxlength="12" required
                 class="w-full rounded-r-xl bg-transparent px-2 py-3 text-lg tracking-wide outline-none">
        </div>
        <p class="mt-1 text-xs text-slate-400">Format: 01X-XXXXXXX</p>

        <p id="phone-error" class="mt-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></p>

        <button type="submit" class="mt-6 w-full rounded-xl bg-brand py-3.5 text-white font-bold hover:bg-brand-light disabled:opacity-60 transition">
          Hantar OTP via WhatsApp
        </button>
      </form>

      <!-- Step 2: OTP -->
      <form id="otp-form" class="hidden" novalidate>
        <button type="button" id="change-phone" class="text-sm text-brand font-medium hover:underline">← Tukar nombor</button>
        <h1 class="mt-3 text-2xl font-extrabold text-brand">Masukkan OTP</h1>
        <p class="mt-1 text-sm text-slate-500">Kod 6 digit telah dihantar ke WhatsApp <strong id="sent-to" class="text-slate-700"></strong>.</p>

        <div id="name-field" class="hidden mt-6">
          <label for="name" class="block text-sm font-semibold text-slate-700">Nama Penuh</label>
          <p class="text-xs text-slate-400">Nombor baru — sila isi nama anda untuk daftar sebagai rujukan.</p>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="80" placeholder="cth. Siti Aminah"
                 class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-brand focus:ring-2 focus:ring-brand/20">
        </div>

        <label for="otp" class="mt-6 block text-sm font-semibold text-slate-700">Kod OTP</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code"
               pattern="\d{6}" maxlength="6" placeholder="••••••" required
               class="mt-2 w-full rounded-xl border border-slate-300 px-4 py-3 text-center text-3xl font-bold tracking-[0.5em] tabular-nums outline-none focus:border-brand focus:ring-2 focus:ring-brand/20">

        <p id="otp-error" class="mt-3 hidden rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700" role="alert"></p>

        <button type="submit" class="mt-6 w-full rounded-xl bg-brand py-3.5 text-white font-bold hover:bg-brand-light disabled:opacity-60 transition">
          Sahkan &amp; Masuk
        </button>
        <p class="mt-4 text-center text-sm text-slate-500">
          Tak terima kod?
          <button type="button" id="resend" class="font-semibold text-brand hover:underline disabled:text-slate-400 disabled:no-underline" disabled>Hantar semula</button>
          <span id="resend-timer" class="tabular-nums"></span>
        </p>
      </form>
    </div>
  </main>

  <script>
    const phoneForm = document.getElementById('phone-form');
    const otpForm = document.getElementById('otp-form');
    const phoneInput = document.getElementById('phone');
    const otpInput = document.getElementById('otp');
    const nameInput = document.getElementById('name');
    const nameField = document.getElementById('name-field');
    const resendBtn = document.getElementById('resend');
    const resendTimer = document.getElementById('resend-timer');
    let isNew = false;
    let resendInterval;

    function showError(id, message) {
      const el = document.getElementById(id);
      el.textContent = message || '';
      el.classList.toggle('hidden', !message);
    }

    // Auto-format as 01X-XXXXXXX while typing.
    phoneInput.addEventListener('input', () => {
      const d = phoneInput.value.replace(/\D/g, '').slice(0, 11);
      phoneInput.value = d.length > 3 ? `${d.slice(0, 3)}-${d.slice(3)}` : d;
    });

    otpInput.addEventListener('input', () => {
      otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, 6);
      if (otpInput.value.length === 6 && (!isNew || nameInput.value.trim().length >= 2)) {
        otpForm.requestSubmit();
      }
    });

    function startResendTimer(seconds) {
      clearInterval(resendInterval);
      resendBtn.disabled = true;
      let left = seconds;
      const tick = () => {
        resendTimer.textContent = left > 0 ? `(${left}s)` : '';
        if (left <= 0) {
          resendBtn.disabled = false;
          clearInterval(resendInterval);
        }
        left -= 1;
      };
      tick();
      resendInterval = setInterval(tick, 1000);
    }

    async function requestOtp() {
      const data = await MO.api('/api/otp/request', { method: 'POST', body: { phone: phoneInput.value } });
      isNew = data.isNew;
      document.getElementById('sent-to').textContent = data.phone;
      nameField.classList.toggle('hidden', !isNew);
      phoneForm.classList.add('hidden');
      otpForm.classList.remove('hidden');
      (isNew ? nameInput : otpInput).focus();
      startResendTimer(60);
    }

    phoneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('phone-error');
      if (!/^01\d-?\d{7,8}$/.test(phoneInput.value.trim())) {
        return showError('phone-error', 'Nombor telefon tidak sah. Contoh: 012-3456789');
      }
      const btn = phoneForm.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        await requestOtp();
      } catch (err) {
        showError('phone-error', err.message);
      } finally {
        btn.disabled = false;
      }
    });

    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      showError('otp-error');
      if (isNew && nameInput.value.trim().length < 2) return showError('otp-error', 'Sila masukkan nama penuh anda.');
      if (!/^\d{6}$/.test(otpInput.value)) return showError('otp-error', 'Sila masukkan OTP 6 digit.');
      const btn = otpForm.querySelector('button[type=submit]');
      btn.disabled = true;
      try {
        const data = await MO.api('/api/otp/verify', {
          method: 'POST',
          body: { phone: phoneInput.value, code: otpInput.value, name: isNew ? nameInput.value : undefined },
        });
        window.location.href = data.redirect || '/dashboard';
      } catch (err) {
        showError('otp-error', err.message);
        otpInput.select();
        btn.disabled = false;
      }
    });

    resendBtn.addEventListener('click', async () => {
      showError('otp-error');
      try {
        await requestOtp();
      } catch (err) {
        showError('otp-error', err.message);
      }
    });

    document.getElementById('change-phone').addEventListener('click', () => {
      clearInterval(resendInterval);
      otpInput.value = '';
      showError('otp-error');
      otpForm.classList.add('hidden');
      phoneForm.classList.remove('hidden');
      phoneInput.focus();
    });
  </script>
</body>
</html>
